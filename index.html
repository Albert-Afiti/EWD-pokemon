<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Pokédex</h1>
    </div>
  </header>

  <main class="container">
    <div id="loading" class="loading">
      <div class="pokeball-spinner"></div>
      <p>Loading Pokémon…</p>
    </div>
    <div id="pokemon-grid" class="pokemon-grid" hidden></div>
    <p id="error-msg" class="error-msg" hidden>Failed to load Pokémon. Please check your connection and refresh.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
